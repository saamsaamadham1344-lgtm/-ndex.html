<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Mobil Silah Oyunu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;}
    canvas{display:block; background:#111;}
    /* Oyun kutusu (çerçeve) */
    #game{
      width:100vw; height:100vh; touch-action:none;   /* touch olaylarını bastırma */
    }
    /* Bileşen kontrol UI: sayım, hp */
    #ui{
      position:absolute; top:5%; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:8px;
      font-size:18px;
    }
  </style>
</head>
<body>
  <div id="ui">Skor: <span id="score">0</span> | HP: <span id="hp">5</span></div>
  <canvas id="game"></canvas>

  <script>
    /*------------------------------------------------------------------
        ##  1. Canvas Ayarı
    ------------------------------------------------------------------*/
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let scaleFactor = 1;                // Mobilde ölçekleme
    function resize(){
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width = w;  canvas.height = h;
      scaleFactor = Math.min(800/w, 600/h) || 1;   // 800x600 referans
      // Konumları yeniden ölçeklendir
      player.x = w/2 - player.w/2;
      player.y = h - player.h - 20;
    }
    window.addEventListener('resize', resize);
    resize();                          // İlk başta başlat

    /*------------------------------------------------------------------
        ##  2. Oyun Nesneleri
    ------------------------------------------------------------------*/
    const player = {w:40*scaleFactor, h:60*scaleFactor, x:0, y:0, speed:5*scaleFactor, hp:5, color:'#00c'};
    const bullets = [];                 // {x,y,w,h,speed,color}
    const enemies = [];                  // {x,y,w,h,speed,color}
    let score = 0;

    /*------------------------------------------------------------------
        ##  3. Düşman Oluşturma (Süreklilik)
    ------------------------------------------------------------------*/
    function spawnEnemy(){
      const w = 40*scaleFactor, h = 40*scaleFactor;
      enemies.push({
        x: Math.random()*(canvas.width - w),
        y: -h,
        w: w, h: h,
        speed: 1*scaleFactor + Math.random()*2*scaleFactor,
        color: '#f00'
      });
    }
    setInterval(spawnEnemy, 1200);

    /*------------------------------------------------------------------
        ##  4. Dokunmatik Kontroller
        - Sol,sağ sürükleme ile oyuncuyu hareket ettir
        - Ekranın herhangi bir yerine dokunarak ateş et
    ------------------------------------------------------------------*/
    let touchStartX = 0, touchStartY = 0;
    let moving = false;
    canvas.addEventListener('touchstart', e=>{
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      moving = true;
      e.preventDefault();
    });

    canvas.addEventListener('touchmove', e=>{
      if(!moving) return;
      const touch = e.touches[0];
      // Basit yatay hareket
      let dx = touch.clientX - touchStartX;
      player.x += dx;
      // Sınır kontrol
      if(player.x < 0) player.x = 0;
      if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;
      touchStartX = touch.clientX;          // Sürekli sürükle
      e.preventDefault();
    });

    canvas.addEventListener('touchend', e=>{
      moving = false;
      // Ateş
      bullets.push({
        x: player.x + player.w/2 - 5*scaleFactor,
        y: player.y,
        w: 10*scaleFactor, h:20*scaleFactor,
        speed:8*scaleFactor,
        color:'#ff0'
      });
      e.preventDefault();
    });

    /*------------------------------------------------------------------
        ##  5. Çarpışma Kontrolü
    ------------------------------------------------------------------*/
    function rectOverlap(a,b){
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

        ##  6. Oyun Döngüsü
    ------------------------------------------------------------------*/

      // Silah arkasını temizle
      ctx.clearRect(0,0,canvas.width,canvas.height);

      /* ------------ Oyuncu --------------- */
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x
